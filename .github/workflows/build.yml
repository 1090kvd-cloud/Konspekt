name: Сборка APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Компоненты Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Создать gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Проверка целостности
        run: |
          # Веб-интерфейс GitHub не удаляет файлы при загрузке новой версии:
          # оставшийся лишний исходник ломает сборку ссылками в никуда.
          fail=0
          for f in \
            app/src/main/java/ru/vzvod/konspekt/logic/Ocr.kt \
            app/src/main/java/ru/vzvod/konspekt/logic/DocxImages.kt \
            app/src/main/assets/tessdata/rus.traineddata
          do
            if [ -e "$f" ]; then
              echo "::error::Лишний файл: $f — удалите его в репозитории"
              echo "  УДАЛИТЬ: $f" >> $GITHUB_STEP_SUMMARY
              fail=1
            fi
          done
          # Ссылки на классы, которых больше нет
          if grep -rqs "TessBaseAPI\|DocxImages" app/src/main/java; then
            echo "::error::В исходниках остались ссылки на удалённые классы"
            fail=1
          fi
          if [ "$fail" != "0" ]; then
            echo "### Сборка остановлена: в репозитории лишние файлы" >> $GITHUB_STEP_SUMMARY
            echo "Веб-интерфейс GitHub не удаляет файлы при загрузке новой версии." >> $GITHUB_STEP_SUMMARY
            echo "Откройте каждый файл из списка выше и удалите его кнопкой с корзиной." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Лишних файлов нет"

      - name: Сборка
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/konspekt-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/konspekt-release.apk
          ls -lh out
          echo "### APK собран" >> $GITHUB_STEP_SUMMARY
          for f in out/*.apk; do
            echo "- \`$(basename $f)\` — $(du -h "$f" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          done

      - name: Выложить APK
        uses: actions/upload-artifact@v5
        with:
          name: konspekt-apk
          path: out/*.apk
          retention-days: 30

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
